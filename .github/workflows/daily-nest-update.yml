name: Daily Nest Update

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    # Allow manual trigger from the Actions tab

jobs:
  update-and-build-nest:
    runs-on: macos-latest

    steps:
      # --- Checkout repository ---
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Set up Python ---
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sentence-transformers open_clip_torch ftfy regex tqdm Pillow numpy maturin

      # --- Install nest Python bindings ---
      - name: Install nest Python module
        run: |
          cd crates/nest
          cargo build --release -p nest-python
          cp target/release/lib_nest.dylib python/_nest.so

      # --- Update mtg.sqlite from Scryfall ---
      - name: Update card database from Scryfall
        id: update_db
        run: |
          echo "=== Updating mtg.sqlite from Scryfall ==="
          
          DATA_DIR="./data"
          DB_PATH="${DATA_DIR}/mtg.sqlite"
          
          mkdir -p "$DATA_DIR"
          
          echo "Downloading oracle cards from Scryfall..."
          curl -L -s -o "${DATA_DIR}/oracle-cards.jsonl.gz.part" "https://data.scryfall.io/oracle-cards/oracle-cards.jsonl.gz"
          mv "${DATA_DIR}/oracle-cards.jsonl.gz.part" "${DATA_DIR}/oracle-cards.jsonl.gz"
          
          echo "Downloading all cards from Scryfall..."
          curl -L -s -o "${DATA_DIR}/all-cards.jsonl.gz.part" "https://data.scryfall.io/all-cards/all-cards.jsonl.gz"
          mv "${DATA_DIR}/all-cards.jsonl.gz.part" "${DATA_DIR}/all-cards.jsonl.gz"
          
          python3 - << 'PYEOF'
          import sqlite3, gzip, json, os
          
          data_dir = os.environ.get('DATA_DIR', './data')
          db_path = os.path.join(data_dir, 'mtg.sqlite')
          oracle_path = os.path.join(data_dir, 'oracle-cards.jsonl.gz')
          all_path = os.path.join(data_dir, 'all-cards.jsonl.gz')
          
          if os.path.exists(db_path):
              os.remove(db_path)
          
          conn = sqlite3.connect(db_path)
          cursor = conn.cursor()
          
          cursor.execute('''
              CREATE TABLE cards (
                  oracle_id TEXT PRIMARY KEY,
                  name TEXT,
                  mana_cost TEXT,
                  cmc REAL,
                  type_line TEXT,
                  oracle_text TEXT,
                  power TEXT,
                  toughness TEXT,
                  loyalty TEXT,
                  colors TEXT,
                  color_identity TEXT,
                  rarity TEXT,
                  set_code TEXT,
                  keywords TEXT,
                  commander_legal TEXT,
                  price_usd TEXT,
                  reserved INTEGER,
                  edhrec_rank INTEGER,
                  uri TEXT,
                  image_uri TEXT,
                  game_changer INTEGER,
                  name_folded TEXT,
                  layout TEXT,
                  image_uri_back TEXT
              )
          ''')
          
          # Also store localized names (Portuguese + others) from all_cards
          cursor.execute('''
              CREATE TABLE names_localized (
                  oracle_id TEXT,
                  lang TEXT,
                  printed_name TEXT,
                  set_code TEXT,
                  PRIMARY KEY (oracle_id, lang, set_code)
              )
          ''')
          
          count = 0
          with gzip.open(oracle_path, 'rt', encoding='utf-8') as f:
              for line in f:
                  try:
                      card = json.loads(line)
                      oracle_id = card.get('oracle_id')
                      if not oracle_id:
                          continue
                      
                      image_uris = card.get('image_uris') or {}
                      image_uri = image_uris.get('normal') or image_uris.get('large') or card.get('image_uri')
                      
                      cursor.execute('''
                          INSERT OR REPLACE INTO cards 
                          (oracle_id, name, mana_cost, cmc, type_line, oracle_text, power, toughness, loyalty,
                           colors, color_identity, rarity, set_code, keywords, commander_legal, price_usd,
                           reserved, edhrec_rank, uri, image_uri, game_changer, name_folded, layout, image_uri_back)
                          VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
                      ''', (
                          oracle_id,
                          card.get('name'),
                          card.get('mana_cost'),
                          card.get('cmc'),
                          card.get('type_line'),
                          card.get('oracle_text'),
                          card.get('power'),
                          card.get('toughness'),
                          card.get('loyalty'),
                          json.dumps(card.get('colors')) if card.get('colors') else None,
                          json.dumps(card.get('color_identity')) if card.get('color_identity') else None,
                          card.get('rarity'),
                          card.get('set_code'),
                          json.dumps(card.get('keywords')) if card.get('keywords') else None,
                          json.dumps(card.get('legalities')) if card.get('legalities') else None,
                          card.get('prices', {}).get('usd'),
                          1 if card.get('reserved') else 0,
                          card.get('edhrec_rank'),
                          card.get('uri'),
                          image_uri,
                          1 if card.get('game_changer') else 0,
                          card.get('name_folded'),
                          card.get('layout'),
                          (card.get('card_faces') or [{}])[1].get('image_uris', {}).get('normal') if card.get('card_faces') and len(card.get('card_faces')) > 1 else None
                      ))
                      count += 1
                  except Exception:
                      continue
          
          conn.commit()
          
          # Process all-cards for localized names
          pt_count = 0
          localized = {}
          with gzip.open(all_path, 'rt', encoding='utf-8') as f:
              for line in f:
                  try:
                      card = json.loads(line)
                      oracle_id = card.get('oracle_id')
                      lang = card.get('lang')
                      printed_name = card.get('printed_name') or card.get('name')
                      set_code = card.get('set_code')
                      if oracle_id and lang and printed_name and set_code:
                          key = (oracle_id, lang, set_code)
                          if key not in localized:
                              localized[key] = printed_name
                  except Exception:
                      continue
          
          for (oracle_id, lang, set_code), printed_name in localized.items():
              cursor.execute('''
                  INSERT OR REPLACE INTO names_localized (oracle_id, lang, printed_name, set_code)
                  VALUES (?, ?, ?, ?)
              ''', (oracle_id, lang, printed_name, set_code))
              if lang == 'pt':
                  pt_count += 1
          
          conn.commit()
          
          cursor.execute('SELECT COUNT(*) FROM cards')
          card_count = cursor.fetchone()[0]
          cursor.execute('SELECT COUNT(*) FROM names_localized WHERE lang = ?', ('pt',))
          pt_total = cursor.fetchone()[0]
          conn.close()
          
          print(f'Built mtg.sqlite: {card_count} cards, {len(localized)} localized names, {pt_count} Portuguese')
          
          with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a') as f:
              f.write(f'db_updated=true\n')
              f.write(f'card_count={card_count}\n')
      env:
        DATA_DIR: ./data

      # --- Build .nest file from database ---
      - name: Build .nest file from database
        id: nest_build
        run: |
          echo "=== Building multimodal .nest file ==="
          
          # Allow downloads on first run so open_clip can fetch CLIP weights
          export NEST_ALLOW_DOWNLOAD=1
          export HF_HUB_OFFLINE=0
          export TRANSFORMERS_OFFLINE=0
          export HF_DATASETS_OFFLINE=0
          
          # Make sure nest python tooling is importable
          export PYTHONPATH="${PYTHONPATH}:$(pwd)/crates/nest/python"
          
          python3 scripts/build_nest_multimodal.py "data/mtg.sqlite" "data/dataset/cards/corpus.nest"
          echo "nest_built=true" >> "$GITHUB_OUTPUT"

      # --- Commit .nest file back to repository ---
      - name: Commit .nest file
        if: steps.nest_build.outputs.nest_built == 'true'
        run: |
          echo "=== Committing .nest file ==="
          
          git config user.name "spellbook-bot"
          git config user.email "bot@spellbook.dev"
          
          git add data/dataset/cards/corpus.nest
          
          if git diff --cached --quiet; then
            echo "No changes to commit - corpus.nest is up to date"
          else
            git commit -m "chore: update corpus.nest with latest MTG card data

            Signed-off-by: spellbook-bot <bot@spellbook.dev>"
            git push origin main
          fi

      # --- Notify ---
      - name: Workflow completion notice
        if: always()
        run: |
          echo "=== Daily nest update workflow completed ==="
          echo "Database updated: ${{ steps.update_db.outputs.db_updated }}"
          echo "Cards: ${{ steps.update_db.outputs.card_count }}"
          echo "Nest built: ${{ steps.nest_build.outputs.nest_built }}"
